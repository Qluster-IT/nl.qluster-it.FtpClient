	<script type="text/javascript">

		function handleError(err) {
			Homey.hideLoadingOverlay();
			Homey.alert(err, 'error');
			return;
		}

		angular.module('ftpclient', ['smart-table'])
			.run(['$rootScope', function ($rootScope) {
				$rootScope.menu = {};
				$rootScope.menu.ftpDirectoryContextMenu = { show: false, element: null };
				$rootScope.menu.ftpFileContextMenu = { show: false, element: null };

				$rootScope.ftpDirectoryCtrl = null;
				$rootScope.ftpFileCtrl = null;

				$rootScope.openMenu = function (menu, directory, file, event) {
					$rootScope.$apply(function () {
						// console.log('set $rootScope.vars.menuDirectory');
						// console.log(directory);
						$rootScope.vars.menuDirectory = directory;
						$rootScope.vars.menuFile = file;
						menu.show = true;
					});
					const width = document.documentElement.clientWidth;
					const height = document.documentElement.clientHeight;
					menu.element.css({
						top: Math.max(8, Math.min(event.clientY, height - menu.element.outerHeight() - 8)),
						left: Math.max(8, Math.min(event.clientX, width - menu.element.outerWidth() - 8)),
						position: 'fixed'
					});
				}
				$rootScope.closeMenu = function (menu) {
					let fc = function () {
						if (!menu) for (const menu of Object.values($rootScope.menu)) {
							menu.show = false;
						}
						else menu.show = false;
					};
					if ($rootScope.$$phase) fc();
					else $rootScope.$apply(fc);
				}
			}])
			.controller("ftpclientCtrl", ['$scope', '$rootScope', '$timeout', '$compile', '$q', function ($scope, $rootScope, $timeout, $compile, $q) {
				//let $;
				const vars = $scope.vars = { path: '', content: { name: '', path: '', fullPath:'', isDirectory: true, children: [], show: true, root: true }, currentDirectory: null };
				vars.currentDirectory = vars.content;
				vars.searchQuery = '';
				vars.updateSearch = function () {
					const query = (vars.searchQuery || '').trim().toLowerCase();
					const directory = vars.currentDirectory;
					if (!query || !directory.loaded) {
						vars.searchResults = null;
						return;
					}
					const matches = entry => entry.name.toLowerCase().includes(query);
					vars.searchResults = {
						directory,
						folders: directory.folders.filter(matches),
						files: directory.files.filter(matches)
					};
					if (vars.selected && directory.children.includes(vars.selected) && !matches(vars.selected)) vars.selected = null;
				};
				vars.setListing = function (directory, entries) {
					directory.children = entries;
					directory.folders = [];
					directory.files = [];
					for (const entry of entries) {
						if (entry.isDirectory) directory.folders.push(entry);
						if (entry.isFile) directory.files.push(entry);
					}
					directory.loaded = true;
				};
				vars.displayPath = function (path) {
					const root = vars.content.id;
					const relative = root && (path === root || path.startsWith(root + '/')) ? path.slice(root.length) : path;
					return relative.replace(/^\/+/, '') || '/';
				};
				$rootScope.vars = vars;

				$scope.view = { display: 'th-small' }
				$scope.stamp = Date.now();
				let doc = $(document.body);
				const closeMenus = function () {
					$rootScope.closeMenu();
				};
				doc.on('click', closeMenus);
				$scope.$on('$destroy', function () { doc.off('click', closeMenus); });

				if (typeof Homey !== 'undefined') {
					$scope.__ = Homey.__;
					Homey.showLoadingOverlay();
					Homey.emit('getRootPath').then((path) => {
						$scope.$apply(() => {
							vars.path = path;
							vars.content.id = path;
							vars.content.path = path;
							vars.content.fullPath = path;
						});
						return Homey.emit('getContent', { path });
					}).then((result) => {
						Homey.hideLoadingOverlay();
						$scope.$apply(() => {
							vars.setListing(vars.content, result);
							//for (const c of result) $scope.vars.parentDirectories[c.path+'/'+c.name] = vars.currentDirectory;


						});
					}).catch(err => handleError(err));
				}
			}])
			.directive('ngEnter', function () {
				return function (scope, element, attrs) {
					element.bind('keydown keypress', function (event) {
						if (event.which === 13) {
							scope.$apply(function () {
								scope.$eval(attrs.ngEnter || attrs.ngClick, {
									$event: event
								});
							});
							event.preventDefault();
						}
					});
				};
			})
			.directive('tooltip', function () {
				return {
					restrict: "A",
					link: function (scope, element, attrs) {
						attrs.$observe('tooltip', function (text) {
							element.attr('title', text);
						});
					}
				};
			})

			.controller('ftpDirectoryCtrl', function ($scope, $rootScope) {
				$scope.__ = Homey.__;
				$scope.vars = $scope.$parent.vars;
				$scope.view = $scope.$parent.view;
				$rootScope.ftpDirectoryCtrl = $scope;

				// function setParentOpened(directory, val) {
				// 	while (directory) {
				// 		directory.childOpen = val;
				// 		directory = $scope.vars.parentDirectories[directory.path+'/'+directory.name];
				// 	}
				// }
				//function getFullPath(directory) { return directory.path + '/' + directory.name; }
				//function getFullPath(directory) { return ( directory.path &&  directory.path.length>0 ? directory.path + '/':'') + directory.name; }

				$scope.hideMenus = function () { return $rootScope.closeMenu(); };

				function getParent(directory, parent = $scope.vars.content) {
					if ((parent.children || []).some(child => child.fullPath === directory.fullPath)) return parent;
					for (const child of parent.children || []) {
						if (child.isDirectory) {
							const found = getParent(directory, child);
							if (found) return found;
						}
					}
				}

				function refreshParent(directory) {
					const parent = getParent(directory) || $scope.vars.content;
					if ($scope.isInPath(directory)) $scope.setCurrentDirectory(parent);
					const selected = $scope.vars.selected;
					if (selected && (selected.fullPath === directory.fullPath || selected.fullPath.startsWith(directory.fullPath + '/'))) {
						$scope.vars.selected = null;
					}
					$scope.getChildren(parent, true);
				}

				$scope.getChildren = function (directory, refresh, func) {
					if (directory.loaded && !refresh) return;
					let oldChildren = directory.children;
					// let path = directory.path + '/' + directory.name;
					// if (path === '/') path = '';
					Homey.showLoadingOverlay();
					return Homey.emit('getContent', { path:directory.fullPath }).then((result) => {
						Homey.hideLoadingOverlay();
						$scope.$apply(() => {
							const previous = new Map((oldChildren || []).map(child => [child.fullPath, child]));
							for (const child of result) {
								const old = previous.get(child.fullPath);
								if (old) {
									child.show = old.show;
									child.loaded = old.loaded;
									child.children = old.children;
									child.folders = old.folders;
									child.files = old.files;
								}
								if($scope.vars.selected && $scope.vars.selected.fullPath===child.fullPath) $scope.vars.selected = child;  //For thumbnails only
								if($scope.vars.currentDirectory && $scope.vars.currentDirectory.fullPath===child.fullPath) $scope.vars.currentDirectory = child;  //For thumbnails only
							}
							$scope.vars.setListing(directory, result);
							$scope.vars.updateSearch();
							if(func) func();
						});
					}).catch(err => handleError(err));
				}

				$scope.setCurrentDirectory = function (directory) {
					if ($scope.vars.currentDirectory.fullPath !== directory.fullPath) {
						$scope.vars.searchQuery = '';
						$scope.vars.searchResults = null;
					}
					$scope.vars.currentDirectory = directory;
					$scope.vars.path = directory.fullPath;// getFullPath(directory);
				}

				$scope.isInPath = function (directory) {
					let path = directory.fullPath;//getFullPath(directory);
					return path === '' || $scope.vars.path === path || $scope.vars.path.startsWith(path + '/');
				}

				$scope.moveItem = function (item, itemDirectory, targetDirectory, func) {
					if(itemDirectory===targetDirectory || itemDirectory.id===targetDirectory.id) return;
					if(item.isDirectory && (targetDirectory.id===item.id || targetDirectory.id.startsWith(item.id + '/'))) return;
					$scope.vars.pendingMove = { item, itemDirectory, targetDirectory, func };
				}

				$scope.confirmMove = function () {
					const { item, itemDirectory, targetDirectory, func } = $scope.vars.pendingMove;
					$scope.vars.pendingMove = null;
					Homey.showLoadingOverlay();
					return Homey.emit('moveItem', {
						item: { id: item.id, name: item.name },
						targetDirectory: { id: targetDirectory.id }
					}).then((result) => {
						Homey.hideLoadingOverlay();
						//$scope
						$rootScope.$apply(() => {
							$scope.vars.selected = null;
							$scope.getChildren(targetDirectory, true, ()=> {
								if($scope.vars.currentDirectory && $scope.vars.currentDirectory.fullPath===itemDirectory.fullPath)
									$scope.getChildren($scope.vars.currentDirectory, true);
								else $scope.getChildren(itemDirectory, true);
								if(func) func();
							});
						});
					}).catch(err => handleError(err));
				}

				$scope.deleteDirectory = function (directory) {
					Homey.showLoadingOverlay();
					return Homey.emit('deleteDirectory', { directory }).then((result) => {
						Homey.hideLoadingOverlay();
						$scope.$apply(() => {
							delete directory.delete;
							refreshParent(directory);
						});
					}).catch(err => handleError(err));
				}

				$scope.renameDirectory = function (directory) {
					Homey.showLoadingOverlay();
					return Homey.emit('renameDirectory', { directory }).then((result) => {
						Homey.hideLoadingOverlay();
						$scope.$apply(() => {
							delete directory.renameName;
							delete directory.rename;
							refreshParent(directory);
						});
					}).catch(err => handleError(err));
				}
				$scope.addDirectory = function (directory) {
					Homey.showLoadingOverlay();
					return Homey.emit('addDirectory', { directory, name: directory.addName }).then((result) => {
						Homey.hideLoadingOverlay();
						$scope.$apply(() => {
							delete directory.add;
							delete directory.addName;
							$scope.getChildren(directory, true);
						});

					}).catch(err => handleError(err));
				}
			})
			.directive('ftpDirectory', [function () {
				return {
					templateUrl: 'ftp-directory.template.html',
					replace: true,
					scope: {
						directory: '=',

						// scope.directory.indent = matches ? matches.length : -1;
						// if (!scope.directory.root) scope.directory.indent++;
					}

			.directive('ftpDirectoryContextMenuClick', ['$rootScope', '$parse', function ($rootScope, $parse) {

			.directive('ftpDirectoryContextMenu', ['$rootScope', function ($rootScope) {
				return {
					templateUrl: 'ftp-directory-context-menu.template.html',
					replace: true,
					restrict: 'E',
					scope: {
						directory: '='
					},
					controller: 'ftpDirectoryCtrl',
					// controller: function($scope) {

			.controller('ftpFileCtrl', function ($scope, $rootScope) {
				$scope.__ = Homey.__;
				$scope.vars = $scope.$parent.vars;
				$scope.view = $scope.$parent.view;
				$rootScope.ftpFileCtrl = $scope;
				$scope.hideMenus = function () { return $rootScope.closeMenu(); };

				$scope.deleteFile = function (file, directory) {

					Homey.showLoadingOverlay();
					return Homey.emit('deleteFile', { file }).then((result) => {
						Homey.hideLoadingOverlay();
						$scope.$apply(() => {
							delete file.delete;
							$rootScope.ftpDirectoryCtrl.getChildren(directory, true);
						});
					}).catch(err => handleError(err));
				}

				$scope.renameFile = function (file, directory) {
					Homey.showLoadingOverlay();
					return Homey.emit('renameFile', { file }).then((result) => {

						Homey.hideLoadingOverlay();
						$scope.$apply(() => {
							delete file.renameName;
							delete file.rename;
							$rootScope.ftpDirectoryCtrl.getChildren(directory, true);
						});
					}).catch(err => handleError(err));
				}

				$scope.downloadFile = function (file) {
					Homey.showLoadingOverlay();
					Homey.emit('getFileUrl', { file }).then((result) => {

						Homey.hideLoadingOverlay();
						$scope.$apply(() => {
							// const blob = base64ToBlob(result.base64);
							// const blobURL = URL.createObjectURL(blob, file.name);
							// const blobURL2 = URL.createObjectURL(blob, file.name);
							// // const link = document.createElement('a');
							// // link.setAttribute('download', file.name)
							// // link.href = blobURL;
							// // document.body.appendChild(link);
							// // link.click();
							// // document.body.removeChild(link);
							// console.log(blobURL);
							// console.log(blobURL2);
							// //Homey.popup(window.location.href.replace('', '') '../../../../../api/app/nl.qluster-it.FtpClient/downloadFiles');
							// Homey.popup(blobURL);
							//Homey.popup("data:application/octet-stream;headers=Content-Disposition: attachment; filename=\"with spaces.txt\";base64," + result.base64);
							//Homey.popup("data:text/plain;headers=Content-Disposition:attachment;filename=%22with%20spaces.txt%22;base64,SGVsbG8sIFdvcmxkIQ==");
							//Homey.popup("http://192-168-1-17.homey.homeylocal.com:47335/");
							Homey.popup(result.url);
						});
						// $scope.$apply(()=> {
						// 	delete file.downloadFile;
						// 	$scope.$parent.getChildren($scope.$parent.file, true);
						// });

					}).catch(err => handleError(err));
				}

				function base64ToBlob(base64, name) {
					const binaryString = window.atob(base64);
					const len = binaryString.length;
					const bytes = new Uint8Array(len);
					for (let i = 0; i < len; ++i) {
						bytes[i] = binaryString.charCodeAt(i);
					}

					//return new File([bytes], name, {"type": "application/octet-stream"});
					return new Blob([bytes], { "type": "application/octet-stream" });
				};
			})

			.directive('ftpFile', [function () {
				return {
					templateUrl: 'ftp-file.template.html',
					replace: true,
					scope: { file: '=', directory: '=' },
					restrict: 'E',
					controller: 'ftpFileCtrl',
					link: function (scope, element) {
						//let matches = scope.file.path.match(/\//g);
						// scope.file.indent = matches ? matches.length : -1;
						// scope.file.indent++;

						scope.getFileIcon = file => window.getFtpFileIcon(file.name);

					}
				};
			}])
			.directive('ftpFileUpload', ['$http', '$parse', function ($http, $parse) {
				return {
					templateUrl: 'ftp-file-upload.template.html',
					replace: true,
					scope: {
						directory: '=',
						Ok: '@',
						onCancel: '@'
					},
					restrict: 'E',
					//transclude:true,

					controller: function ($scope) {
						$scope.__ = Homey.__;

						$scope.attrs = null;
						$scope.uploadFiles = async function (event) {
							const files = Array.from(event.target.files);
							if (!files.length || $scope.uploadProgress) return;
							const endpoint = '../../../../../api/app/nl.qluster-it.FtpClient/uploadFilePartials';
							let id, completed = 0;
							const total = files.reduce((bytes, file) => bytes + file.size, 0);
							const progress = (name, value) => {
								$scope.uploadProgress = { name, value, total: total || 1 };
								$scope.$applyAsync();
							};
							progress(files[0].name, 0);
							try {
								for (const file of files) {
									progress(file.name, completed);
									const upload = await Homey.emit('uploadFiles', {
										directory: { id: $scope.directory.id }, name: file.name, size: file.size
									});
									id = upload.id;
									for (let offset = 0; offset === 0 || offset < file.size; offset += upload.chunkBytes) {
										const end = Math.min(file.size, offset + upload.chunkBytes);
										const base64 = end === offset ? '' : await new Promise((resolve, reject) => {
											const reader = new FileReader();
											reader.onload = () => resolve(reader.result.slice(reader.result.indexOf(',') + 1));
											reader.onerror = () => reject(reader.error);
											reader.onabort = () => reject(new Error(Homey.__('repair.uploadFailed')));
											reader.readAsDataURL(file.slice(offset, end));
										});
										let reply = await $http.post(endpoint, { id, offset, base64 });
										while (reply && reply.data && reply.data.pending) {
											await new Promise(resolve => setTimeout(resolve, 1000));
											reply = await $http.post(endpoint, { id, status: true });
										}
										progress(file.name, total ? completed + end : 1);
									}
									id = undefined;
									completed += file.size;
								}
								$scope.$apply(() => {
									delete $scope.directory.uploading;
									$scope.directory.show = true;
									$scope.$parent.getChildren($scope.directory, true);
									if ($scope.attrs.onOk) $parse($scope.attrs.onOk)($scope.$parent);
								});
							} catch (error) {
								if (id) {
									try { await $http.post(endpoint, { id, cancel: true }); }
									catch (cleanupError) { console.warn('FTP upload session will expire', cleanupError.status); }
								}
								Homey.alert(error.message || (error.data && error.data.error) || String(error), 'error');
							} finally {
								$scope.$applyAsync(() => { delete $scope.uploadProgress; });
								event.target.value = '';
							}
						}
					},
					link: function (scope, element, attrs) {
						scope.attrs = attrs;
						scope.cancel = function ($event) {
							$event.preventDefault();
							$event.stopPropagation();
							if (!scope.uploadProgress) $parse(attrs.onCancel)(scope.$parent);

						}
					}
				};
			}])
			.directive('ftpFileContextMenuClick', ['$rootScope', '$parse', function ($rootScope, $parse) {

			.directive('ftpDialog', ['$timeout', function ($timeout) {
				return {
					restrict: 'A',
					link: function (scope, element, attrs) {
						const node = element[0];
						const previousFocus = document.activeElement;
						const focusTask = $timeout(function () {
							const target = node.querySelector('input') || node.querySelector('.ftp-button-secondary') || node;
							target.focus({ preventScroll: true });
						}, 0, false);
						function keydown(event) {
							if (event.key === 'Escape') {
								event.preventDefault();
								event.stopPropagation();
								scope.$apply(() => scope.$eval(attrs.ftpDialog, { $event: event }));
							} else if (event.key === 'Tab') {
								const controls = Array.from(node.querySelectorAll('input:not(:disabled), button:not(:disabled)'))
									.filter(control => control.getClientRects().length);
								const first = controls[0], last = controls[controls.length - 1];
								if (controls.length && (event.shiftKey ? document.activeElement === first : document.activeElement === last)) {
									event.preventDefault();
									(event.shiftKey ? last : first).focus();
								}
							}
						}
						node.addEventListener('keydown', keydown);
						scope.$on('$destroy', function () {
							$timeout.cancel(focusTask);
							node.removeEventListener('keydown', keydown);
							if (previousFocus && previousFocus.isConnected) previousFocus.focus({ preventScroll: true });
						});
					}
				};
			}])
			.directive('windowConfirm', ['$parse', function ($parse) {

				return {
					templateUrl: 'window-confirm.template.html',
					//replace:true,
					scope: {
						onOk: '@',
						onCancel: '@',
						title: '@',
						message: '@',
						action: '@'

					},
					restrict: 'E',
					transclude: true,
					controller: function ($scope) {
						$scope.__ = Homey.__;
						$scope.confirmKey = {
							create: 'repair.addFolder', rename: 'repair.rename', delete: 'repair.delete', move: 'repair.move'
						}[$scope.action] || 'repair.ok';
						$scope.actionIcon = {
							create: 'fa-folder-plus', rename: 'fa-i-cursor', delete: 'fa-trash-alt', move: 'fa-exchange-alt'
						}[$scope.action] || 'fa-check';
					},
					link: function (scope, element, attrs) {
						scope.closed = false;
						scope.ok = function ($event) {
							$event.preventDefault();
							$event.stopPropagation();
							$parse(attrs.onOk)(scope.$parent);
						}
						scope.cancel = function ($event) {
							$event.preventDefault();
							$event.stopPropagation();
							$parse(attrs.onCancel)(scope.$parent);

						}
					}
				};
			}])

			;
	</script>
