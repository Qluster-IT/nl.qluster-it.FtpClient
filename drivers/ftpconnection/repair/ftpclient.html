<div  ng-app="ftpclient" ng-controller="ftpclientCtrl as ftpclient">

			<!-- <button class="field margin-top" ng-click="mainForm.$valid && vars.microWebServerFtpPort ? updatemicroWebServerFtpPort() : null" ng-disabled="!mainForm.$valid || !vars.microWebServerFtpPort">Update Settings</div> -->

	<div id="overlay"></div>
	<script type="text/javascript">

		angular.module('ftpclient', ['smart-table', 'ngDragDrop'])
			.run(['$rootScope', function($rootScope) {
				$rootScope.menu = {};				
				$rootScope.menu.ftpDirectoryContextMenu = {show:false, element:null};
				$rootScope.menu.ftpFileContextMenu = {show:false, element:null};

				$rootScope.ftpDirectoryCtrl = null;
				$rootScope.ftpFileCtrl = null;

				$rootScope.openMenu = function(menu, directory, file, event) {
					$rootScope.$apply(function() {
						// console.log('set $rootScope.vars.menuDirectory');
						// console.log(directory);
						$rootScope.vars.menuDirectory = directory;
						$rootScope.vars.menuFile = file;
						menu.show = true;
					});
					let width = $(document).width();
					if(event.pageX<=(width/2)) 
						menu.element.css({'top':event.pageY-50,'left':event.pageX, 'position':'absolute'});
					else
						menu.element.css({'top':event.pageY-50,'left':(event.pageX - menu.element.outerWidth()), 'position':'absolute'}); 
				}
				$rootScope.closeMenu = function(menu) {
					let fc = function() {
						if(!menu) for (const menu of Object.values($rootScope.menu)) {
							menu.show = false;
						}
						else menu.show = false;
					};
					if($rootScope.$$phase) fc();					
					else $rootScope.$apply(fc);
				}
			}])
			.controller("ftpclientCtrl", ['$scope', '$rootScope', '$timeout', '$compile', '$q', function ($scope, $rootScope, $timeout, $compile, $q) {
				//let $;
				const vars = $scope.vars = {path:'', content:{name:'', path:'', isDirectory:true, children:[], show:true, root:true, childOpen:true}, currentDirectory:null };
				vars.currentDirectory = vars.content;
				$rootScope.vars = vars;

				$scope.view = {display:'th-small'}
				$scope.stamp = Date.now();
				let doc = $(document.body);
				doc.on('click', function(event) {
					$rootScope.closeMenu();
				});
				
				if (typeof Homey !== 'undefined') {
					$scope.__ = Homey.__;
					Homey.emit('getContent', {path:''}).then((result)=> {
						$scope.$apply(()=> {
							vars.content.children = result;
							//for (const c of result) $scope.vars.parentDirectories[c.path+'/'+c.name] = vars.currentDirectory;
								
							
						});
					});
				}
			}])
			.directive('ngEnter', function () {
				return function (scope, element, attrs) {
					element.bind('keydown keypress', function (event) {
						if (event.which === 13) {
							scope.$apply(function () {
								scope.$eval(attrs.ngEnter || attrs.ngClick, {
									$event: event
								});
							});
							event.preventDefault();
						}
					});
				};
			})
			.directive('tooltip', function ($compile) {
				var contentContainer;
				return {
					restrict: "A",
					scope: {
						myTooltipScope: "="
					},
					link: function (scope, element, attrs) {
						var text = attrs.tooltip;

						scope.hidden = true;

						var tooltipElement = angular.element("<div ng-hide='hidden' class='tooltip'>");
						tooltipElement.append("<div>" + text.replaceAll('\r\n', '<br/>') + "</div>");

						element.append(tooltipElement);
						element
							.on('mouseenter', function () { scope.hidden = false; scope.$digest(); })
							.on('mouseleave', function () { scope.hidden = true; scope.$digest(); })
							.on('click', function () { scope.hidden = true; scope.$digest(); });

						var toolTipScope = scope.$new(true);
						angular.extend(toolTipScope, scope.myTooltipScope);
						$compile(tooltipElement.contents())(toolTipScope);
						$compile(tooltipElement)(scope);
					}
				};
			})
			
			.controller('ftpDirectoryCtrl', function($scope, $rootScope) {
				$scope.vars = $scope.$parent.vars;
				$scope.view = $scope.$parent.view;
				$rootScope.ftpDirectoryCtrl = $scope;
				
				// function setParentOpened(directory, val) {
				// 	while (directory) {
				// 		directory.childOpen = val;
				// 		directory = $scope.vars.parentDirectories[directory.path+'/'+directory.name];
				// 	}
				// }
				function dropItem(scopeSource, scopeTarget) {
					if(scopeSource.file) {
						$scope.moveItem(scopeSource.file, scopeSource.directory, scopeTarget.directory);
					} else if(scopeSource.directory) {
						$scope.moveItem(scopeSource.directory, scopeSource.parentDirectory, scopeTarget.directory);
					}
				}

				function getFullPath(directory) { return directory.path  + '/' + directory.name; }
				//function getFullPath(directory) { return ( directory.path &&  directory.path.length>0 ? directory.path + '/':'') + directory.name; }

				$scope.hideMenus = function() { return $rootScope.closeMenu(); };
				
				$scope.dropItem = function(a,b, c, d) {
					var scopeTarget = angular.element($(a.target)).scope();
					var scopeSource = angular.element(b.draggable.get(0)).scope();
					dropItem(scopeSource, scopeTarget);
				}
				
				$scope.dropItemUp = function(a,b, c, d) {
					var scopeTarget = angular.element($(a.target)).scope();
					var scopeSource = angular.element(b.draggable.get(0)).scope();
					dropItem(scopeSource, scopeTarget.$parent.$parent);
				}
				
				
				$scope.getChildren = function(directory, refresh) {
					if(directory.children && directory.children.length && !refresh) return;
					let path = directory.path +'/' + directory.name;
					if(path==='/') path='';
					Homey.emit('getContent', {path}).then((result)=> {
						$scope.$apply(()=> {
							directory.children = result;
							// for (const c of result) $scope.vars.parentDirectories[c.path+'/'+c.name] = directory;
						});
					});
				}
				
				$scope.setCurrentDirectory = function(directory) {
					$scope.vars.currentDirectory = directory;
					$scope.vars.path = getFullPath(directory);
				}

				$scope.isInPath = function(directory) {
					let path = getFullPath(directory);
					return path==='' || $scope.vars.path.startsWith(path);
				}
				
				$scope.moveItem = function(item, itemDirectory, targetDirectory) {
					Homey.emit('moveItem', {item, targetDirectory}).then((result)=> {
						$scope.$apply(()=> {
							$scope.getChildren(targetDirectory, true);
							$scope.getChildren(itemDirectory, true);
						});
					});
				}

				$scope.deleteDirectory = function(directory) {
					Homey.emit('deleteDirectory', {directory}).then((result)=> {
						$scope.$apply(()=> {
							delete directory.delete;
							$scope.getChildren($scope.$parent.directory || $scope.vars.currentDirectory, true);
						});
					});
				}
				
				$scope.renameDirectory = function(directory) {
					Homey.emit('renameDirectory', {directory}).then((result)=> {
						$scope.$apply(()=> {
							delete directory.renameName;
							console.log('$scope.directory');
							console.log($scope.directory);
							console.log('$scope.$parent.directory');
							console.log($scope.$parent.directory);
							$scope.getChildren($scope.$parent.directory || $scope.vars.currentDirectory, true);
						});
					});
				}
				$scope.addDirectory = function(directory) {
					Homey.emit('addDirectory', {directory, name:directory.addName}).then((result)=> {
						$scope.$apply(()=> {
							delete directory.add;
							delete directory.addName;
							$scope.getChildren($scope.directory, true);
						});
					});
				}
			})
			.directive('ftpDirectory', [function () {
				return {
					templateUrl: 'ftp-directory.template.html',
					replace:true,
					scope: {
						directory: '=',
						parentDirectory: '='
					},
					restrict: 'E',
					controller:'ftpDirectoryCtrl',
					link: function(scope, element) {
						let matches = scope.directory.path.match(/\//g);
						scope.directory.indent = matches ? matches.length : -1;
						if(!scope.directory.root) scope.directory.indent++;
					}
				};
			}])
			.directive('ftpDirectoryContextMenuClick', ['$rootScope', '$parse', function ($rootScope, $parse) {
				return {
					restrict: 'A',
					controller: function($scope) {						
					},
					link: function(scope, element, attrs) {
						element.on("contextmenu", function (e) {
							e.preventDefault(); 
							e.stopPropagation();
							$parse(attrs.ftpDirectoryContextMenuClick)(scope); //.$parent
							console.log(scope);
							$rootScope.openMenu($rootScope.menu.ftpDirectoryContextMenu, scope.directory, null, e);
							console.log("Element right clicked.");
						});
					}
				};
			}])
			.directive('ftpDirectoryContextMenu', ['$rootScope', function ($rootScope) {
				return {
					templateUrl: 'ftp-directory-context-menu.template.html',
					replace:true,
					restrict: 'E',
					scope: {
						directory: '='
					},
					controller:'ftpDirectoryCtrl',
					// controller: function($scope) {
					// 	$rootScope.menu.ftpDirectoryContextMenu = {show:false, element:null};
						
					//  },
					link: function(scope, element) {
						scope.menu = $rootScope.menu;
						$rootScope.menu.ftpDirectoryContextMenu.element = element;

						
					}
				};
			}])
			.controller('ftpFileCtrl', function($scope, $rootScope) {
				$scope.vars = $scope.$parent.vars;
				$scope.view = $scope.$parent.view;
				$rootScope.ftpFileCtrl = $scope;
				$scope.hideMenus = function() { return $rootScope.closeMenu(); };
				
				$scope.deleteFile = function(file, directory) {
					
					Homey.emit('deleteFile', {file}).then((result)=> {
						$scope.$apply(()=> {
							delete file.delete;
							$rootScope.ftpDirectoryCtrl.getChildren(directory, true);
						});
					});
				}
				
				$scope.renameFile = function(file, directory) {
					Homey.emit('renameFile', {file}).then((result)=> {
						$scope.$apply(()=> {
							delete file.renameName;
							$rootScope.ftpDirectoryCtrl.getChildren(directory, true);
						});
					});
				}
				
				$scope.downloadFile = function(file) {
					Homey.emit('getFileUrl', {file}).then((result)=> {
						$scope.$apply(()=> {
							// const blob = base64ToBlob(result.base64);
							// const blobURL = URL.createObjectURL(blob, file.name);
							// const blobURL2 = URL.createObjectURL(blob, file.name);
							// // const link = document.createElement('a');
							// // link.setAttribute('download', file.name)
							// // link.href = blobURL;
							// // document.body.appendChild(link);
							// // link.click();
							// // document.body.removeChild(link);
							// console.log(blobURL);
							// console.log(blobURL2);
							// //Homey.popup(window.location.href.replace('', '') '../../../../../api/app/nl.qluster-it.FtpClient/downloadFiles');
							// Homey.popup(blobURL);
							//Homey.popup("data:application/octet-stream;headers=Content-Disposition: attachment; filename=\"with spaces.txt\";base64," + result.base64);
							//Homey.popup("data:text/plain;headers=Content-Disposition:attachment;filename=%22with%20spaces.txt%22;base64,SGVsbG8sIFdvcmxkIQ==");
							//Homey.popup("http://192-168-1-17.homey.homeylocal.com:47335/");
							Homey.popup(result.url);
						});
						// $scope.$apply(()=> {
						// 	delete file.downloadFile;
						// 	$scope.$parent.getChildren($scope.$parent.file, true);
						// });
					});
				}

				function base64ToBlob(base64, name) {
					const binaryString = window.atob(base64);
					const len = binaryString.length;
					const bytes = new Uint8Array(len);
					for (let i = 0; i < len; ++i) {
						bytes[i] = binaryString.charCodeAt(i);
					}
			
					//return new File([bytes], name, {"type": "application/octet-stream"});
					return new Blob([bytes], {"type": "application/octet-stream"});
				};					
			})
			
			.directive('ftpFile', [function () {

				return {
					templateUrl: 'ftp-file.template.html',
					replace:true,
					scope: {file: '=', directory:'='},
					restrict: 'E',
					controller: 'ftpFileCtrl',
					link: function(scope, element) {
						let matches = scope.file.path.match(/\//g);
						scope.file.indent = matches ? matches.length : -1;
						scope.file.indent ++;

						scope.getFileIcon = function(file) {
							let ext = _.last(file.name.split('.')).toLowerCase();
							switch (ext) {
								case 'mp3': 
								case 'wav':
									return 'fa-file-audio';
								case 'jpg': 
								case 'jpeg':
								case 'gif': 
								case 'png':
								case 'svg': 
								case 'bpm':
									return 'fa-file-image';
								case 'zip': 
								case 'rar':
									return 'fa-file-archive';
								case 'doc': 
								case 'docx':
									return 'fa-file-word';
								case 'xls': 
								case 'xlsx':
									return 'fa-file-excel';
								case 'js': 
								case 'json':
									return 'fa-file-code';
								case 'ppt': 
								case 'pptx':
									return 'fa-file-powerpoint';
								case 'pdf': 
									return 'fa-file-pdf';
								default: return 'fa-file';
							}
						}

					}
				};
			}])				
			.directive('ftpFileUpload', ['$http', '$parse', function ($http, $parse) {
				return {
					templateUrl: 'ftp-file-upload.template.html',
					replace:true,
					scope: {
						directory: '=',						
						Ok:'@',						
						onCancel:'@'
					},
					restrict: 'E',
					//transclude:true,

					controller: function($scope) {

						function _arrayBufferToBase64( buffer ) {
							var binary = '';
							var bytes = new Uint8Array( buffer );
							var len = bytes.byteLength;
							for (var i = 0; i < len; i++) {
								binary += String.fromCharCode( bytes[ i ] );
							}
							return window.btoa( binary );
						}

						console.log("ftpFileUpload controller function called");
						$scope.attrs = null;
						$scope.uploadFiles = function(element) {
							console.log($scope);
							let attrs = $scope.attrs;
							
							let q=[];
							let fc = ()=> {
								console.log('emit');
								
								Homey.emit('uploadFiles', ).then((result)=>{
									$http.post('../../../../../api/app/nl.qluster-it.FtpClient/uploadFiles',  {directory:$scope.directory, files:q, id:result.id}).then(()=>{
										delete $scope.directory.uploading;
										$scope.$parent.getChildren($scope.directory, true);
										$scope.directory.show = $scope.directory.shown = true;		
										if(attrs.onOk) $parse(attrs.onOk)($scope.$parent);								
									});
								 });
							};
							for (let i = 0; i < element.target.files.length; i++) {
								const file = element.target.files[i];
								r = new FileReader();

								r.onloadend = function(e) {
									var base64String = _arrayBufferToBase64(e.target.result);
									q.push({name:file.name, base64:base64String});
									if(q.length===element.target.files.length) fc();
								}
								r.readAsArrayBuffer(file);
							}
						}
						$scope.deleteDirectory = function(directory) {

						}
					},
					link: function(scope, element, attrs) {
						console.log('ftpFileUpload link');
						scope.attrs = attrs;
						scope.cancel = function($event) {							
							$event.stopPropagation();
							$parse(attrs.onCancel)(scope.$parent);
							
						}
					}
				};
			}])			
			.directive('ftpFileContextMenuClick', ['$rootScope', '$parse', function ($rootScope, $parse) {
				return {
					restrict: 'A',
					controller: function($scope) {						
					},
					link: function(scope, element, attrs) {
						element.on("contextmenu", function (e) {
							console.log(scope);
							e.preventDefault(); 
							e.stopPropagation();							
							$parse(attrs.ftpFileContextMenuClick)(scope); //.$parent
							$rootScope.openMenu($rootScope.menu.ftpFileContextMenu, scope.directory, scope.file, e);
							console.log("Element right clicked.");
						});
					}
				};
			}])
			.directive('ftpFileContextMenu', ['$rootScope', function ($rootScope) {
				return {
					templateUrl: 'ftp-file-context-menu.template.html',
					replace:true,
					restrict: 'E',
					scope: {
						directory: '=',
						file: '='
					},
					controller:'ftpFileCtrl',
					link: function(scope, element) {
						scope.menu = $rootScope.menu;
						$rootScope.menu.ftpFileContextMenu.element = element;
					}
				};
			}])
			
			.directive('fileOnChange', function() {
				return {
					restrict: 'A',
					link: function (scope, element, attrs) {
						var onChangeHandler = scope.$eval(attrs.fileOnChange);
						element.on('change', onChangeHandler);//(element)=>{if(onChangeHandler) onChangeHandler(element, scope.directory)});
						element.on('$destroy', function() {
							element.off();
						});

					}
				};
			})
			.directive('windowConfirm', ['$parse', function ($parse) {

				return {
					templateUrl: 'window-confirm.template.html',
					//replace:true,
					scope: {
						onOk:'@',
						onCancel:'@',
						title: '@',
						message: '@'

					},
					restrict: 'E',
    				transclude: true,
					controller: function($scope) {
						
					},
					link: function(scope, element, attrs) {
						scope.closed = false;
						scope.ok = function($event) {
							$event.preventDefault();					
							$event.stopPropagation();
							$parse(attrs.onOk)(scope.$parent);
						}
						scope.cancel = function($event) {
							$event.preventDefault();
							$event.stopPropagation();
							$parse(attrs.onCancel)(scope.$parent);
							
						}
					}
				};
			}])		
			
			;
	</script>
</div>
