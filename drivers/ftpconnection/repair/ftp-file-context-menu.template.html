<div class="ftp-context-menu" ng-show="menu.ftpFileContextMenu.show" ng-click="$event.stopPropagation();">
    <div class="item" ng-click="downloadFile(file, directory); menu.ftpFileContextMenu.show=false;$event.stopPropagation();">
        <span class="fa fa-icon fa-file-download"></span>
        <span>{{__('repair.download')}}</span>
    </div>
    <div class="item" ng-click="file.rename = true;file.renameName = file.name; ">
        <span class="fa fa-icon fa-i-cursor" ng-click="file.rename = true;file.renameName = file.name; $event.stopPropagation();"></span>
        <span>{{__('repair.rename')}}</span>
        <window-confirm action="rename" title="{{__('repair.renameFile')}}" message="{{__('repair.fileName')}}" on-ok="renameFile(file, directory);menu.ftpFileContextMenu.show=false;" on-cancel="file.rename=false;menu.ftpFileContextMenu.show=false;" ng-if="file.rename">
            <input type="text" ng-model="file.renameName" aria-label="{{__('repair.fileName')}}">
        </window-confirm>
    </div>
    <div class="item" ng-click="file.delete = true; ">
        <span class="fa fa-icon fa-trash-alt"></span>
        <span>{{__('repair.delete')}}</span>
        <window-confirm action="delete" title="{{__('repair.deleteFile')}}" message="{{__('repair.deleteFilePrompt', {name:file.name})}}" on-ok="deleteFile(file, directory);menu.ftpFileContextMenu.show=false;" on-cancel="file.delete=false;menu.ftpFileContextMenu.show=false;" ng-if="file.delete"></window-confirm>
    </div>
    
</div>
