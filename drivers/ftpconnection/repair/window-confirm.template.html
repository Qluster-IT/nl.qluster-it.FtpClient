<div class="window" ng-click=" $event.stopPropagation();">
    <div class="field">{{title}}</div>
    <div class="field">{{message}}</div>
    <div class="field" ng-transclude></div>
    <div class="field margin-top buttons">
        <button ng-click="ok($event);">Ok</button>
        <button ng-click="cancel($event);">Cancel</button>
    </div>
</div>
