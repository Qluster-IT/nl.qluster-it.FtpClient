<li ng-style="{'padding-left':(indent*20)+'px'}">
    <span class="ftp-file-header" >
        <span class="far fa-icon {{getFileIcon(file)}}"></span>
        {{file.name}}
        <span class="float-right">
            <span ng-if="!file.root" class="fa fa-icon fa-trash-alt" ng-click="file.delete = true; $event.stopPropagation();">
                <window-confirm title="Delete file?" message="Do you want to delete '{{file.name}}'?" on-ok="deleteFile(file)" on-cancel="file.delete=false;" ng-show="file.delete"></window-confirm>
            </span>
            <span ng-if="!file.root" class="fa fa-icon fa-i-cursor" ng-click="file.rename = true;file.renameName = file.name; $event.stopPropagation();">
                <window-confirm title="Rename file" message="Enter the file name:" on-ok="renameFile(file)" on-cancel="file.rename=false;" ng-show="file.rename">                    
                    <input type="text" ng-model="file.renameName">
                </window-confirm>
            </span>
        </span>
    </span>
</li>
